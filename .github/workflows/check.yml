name: check

# When it runs: on a release tag and by hand, not on every push. The kit's
# ladder is what a contributor runs locally before pushing.
#   gh workflow run check.yml
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# No marketplace actions: the runner's own git and Node do the work, so the
# workflow runs under any organisation policy on allowed actions.
jobs:
  kit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the commit
        run: |
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
      - name: Node and npm versions
        run: node --version && npm --version
      - name: Install
        run: npm ci
      - name: Browser for the checks
        run: npx playwright install --with-deps chromium
      - name: Validator tests
        run: npm test
      - name: Scaffold the starter game
        run: npm run new-game -- ci-game "CI Game"
      - name: Render the art
        run: npm run render-icon -- games/ci-game && npm run render-banner -- games/ci-game
      - name: The ladder
        run: npm run ladder -- games/ci-game
      - name: Pack for upload
        run: npm run pack -- games/ci-game
